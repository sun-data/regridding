name: tests-cuda

# The device kernel in
# `regridding/_weights/_weights_conservative_2d/_clipping_cuda.py` needs a
# CUDA device, which the standard runners do not have, so its tests skip
# everywhere else.  This job runs them on a GPU runner.
#
# The runner is a GitHub-hosted larger runner and is billed by the minute
# even though this repository is public, so the job is kept small: it is
# cancelled when superseded, capped by a timeout, and never run for a pull
# request from a fork.

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cuda:
    name: GPU, Python 3.13 test
    # a fork cannot be trusted with a runner which costs money to start
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: gpu-runner
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Show the device
        run: nvidia-smi
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel
          pip install -e .[test,cuda]
      - name: Confirm the device is visible to numba
        run: |
          python -c "from numba import cuda; assert cuda.is_available(); print(cuda.get_current_device().name)"
      - name: Test with pytest
        run: |
          pip install pytest pytest-cov
          pytest --cov=regridding --cov-report=xml
      - name: Test with Numba disabled
        env:
          NUMBA_DISABLE_JIT: 1
        run: |
          pytest --cov=regridding --cov-report=xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: unittests
          env_vars: OS,PYTHON
          name: codecov-umbrella
          fail_ci_if_error: true
