[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "regridding"
authors = [
    {name = "Roy T. Smart", email = "roytsmart@gmail.com"},
]
description = "Numba-accelerated interpolation routines"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>2",
    "numba",
]
dynamic = ["version"]

[project.optional-dependencies]
test = [
    "pytest",
    "scipy",
    "astropy",
]
cuda = [
    # `numba.cuda` supplies the kernels, but not a prefix sum
    "torch",
]
doc = [
    "pytest",
    "scipy",
    "matplotlib",
    "graphviz",
    "sphinx-autodoc-typehints",
    "sphinxcontrib-bibtex",
    "pydata-sphinx-theme",
    "ipykernel",
    "jupyter-sphinx",
    "sphinx-favicon",
]
benchmark = [
    "asv<=0.6.1",
]

[project.urls]
Homepage = "https://github.com/sun-data/regridding"
Documentation = "https://regridding.readthedocs.io/en/latest"

[tool.pyright]
include = ["regridding"]
# The tests are excluded because `astropy` does not ship a `py.typed` marker.
# Expressions such as `numpy.linspace(...) * astropy.units.mm`, which the tests
# use heavily, are therefore inferred as a union of unit types rather than as a
# `Quantity`, and silencing that requires more noise than the tests are worth.
exclude = ["**/_tests", "**/*_test.py"]
typeCheckingMode = "standard"

[tool.setuptools.package-data]
regridding = ["py.typed"]

[tool.setuptools_scm]

[tool.coverage.run]
omit = [
    "benchmarks/*",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
