name: tests-cuda

# The device kernel in
# `regridding/_weights/_weights_conservative_2d/_clipping_cuda.py` needs a
# CUDA device, which the standard runners do not have, so its tests skip
# everywhere else.  This job runs them on a GPU runner.
#
# The runner is named by the `GPU_RUNNER` repository variable, and the job is
# skipped while that is unset, so this file does nothing until somebody
# provisions a runner and points the variable at it.  Without the guard the
# job would queue forever waiting for a runner which does not exist.
#
# The runner is a GitHub-hosted larger runner and is billed by the minute
# even though this repository is public, so the job is kept small: it is
# cancelled when superseded, capped by a timeout, and never run for a pull
# request from a fork.

on:
  push:
    branches:
      - main
  pull_request:
  # so the device tests can be run against a branch on demand, without
  # having to push a commit to provoke them
  workflow_dispatch:

env:
  # the toolkit `numba` compiles kernels with; the driver on the runner is
  # newer than this and so runs it, since drivers are backward compatible
  CUDA_VERSION: "12.6"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cuda:
    name: GPU, Python 3.13 test
    # skipped until a runner exists, and never run for a fork, which cannot be
    # trusted with a runner that costs money to start
    if: >-
      vars.GPU_RUNNER != '' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ vars.GPU_RUNNER }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Show the device
        run: nvidia-smi
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel
          pip install -e .[test,cuda]
      # The GPU image ships the driver but no CUDA toolkit, and `numba` needs
      # one to compile a kernel: `libnvvm` and `libdevice` to emit PTX, and
      # `libcudart` to decide which compute capabilities it may target.  Only
      # those two packages are installed, rather than the whole toolkit.
      - name: Install the CUDA toolkit
        run: |
          . /etc/os-release
          distro="${ID}${VERSION_ID//./}"
          wget -q "https://developer.download.nvidia.com/compute/cuda/repos/${distro}/x86_64/cuda-keyring_1.1-1_all.deb"
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends             "cuda-nvcc-${CUDA_VERSION//./-}"             "cuda-cudart-dev-${CUDA_VERSION//./-}"
          echo "CUDA_HOME=/usr/local/cuda-${CUDA_VERSION}" >> "$GITHUB_ENV"
      - name: Diagnose the CUDA setup
        run: |
          echo "CUDA_HOME=$CUDA_HOME"
          ls "$CUDA_HOME/nvvm/lib64" "$CUDA_HOME/nvvm/libdevice" 2>&1 | head
          python -c "
          from numba.cuda.cuda_paths import get_cuda_paths
          for k, v in get_cuda_paths().items():
              print(f'  {k:20s} by={v.by} info={v.info}')
          from numba.cuda.cudadrv.runtime import runtime
          print('  cudart:', runtime.get_version())
          from numba.cuda.cudadrv import nvvm
          print('  supported ccs:', nvvm.get_supported_ccs())
          " || true
      - name: Confirm the device is visible to numba
        run: |
          python -c "from numba import cuda; assert cuda.is_available(); print(cuda.get_current_device().name)"
      - name: Test with pytest
        run: |
          pip install pytest pytest-cov
          pytest --cov=regridding --cov-report=xml
      - name: Test with Numba disabled
        env:
          NUMBA_DISABLE_JIT: 1
        run: |
          pytest --cov=regridding --cov-report=xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: unittests
          env_vars: OS,PYTHON
          name: codecov-umbrella
          fail_ci_if_error: true
